version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "5000:8000"  # Cambiado de 8000:8000 a 5000:8000
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    ports:
      - "4000:80"  # Cambiado de 3000:80 a 4000:80
    depends_on:
      - backend
    restart: unless-stopped